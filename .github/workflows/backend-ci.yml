name: Build C++ API

on:
  push:
    paths:
      - "backend/**"
      - "index.html"
      - "README.md"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - "index.html"
      - "README.md"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      VCPKG_COMMIT: c653b77e80d1b61e5f5bd2eabf15bc6ec3bfe7ad
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: jirani_circle
      DB_USER: jirani_ci
      DB_PASSWORD: ci-only-password
      MYSQL_ROOT_PASSWORD: ci-root-password
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: jirani_circle
          MYSQL_USER: jirani_ci
          MYSQL_PASSWORD: ci-only-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes autoconf autoconf-archive automake build-essential curl default-mysql-client gdb libtool ninja-build pkg-config unzip zip

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: ${{ runner.os }}-vcpkg-${{ hashFiles('backend/vcpkg.json', 'backend/vcpkg-overlay-ports/drogon/**') }}

      - name: Set up vcpkg
        run: |
          git init "$RUNNER_TEMP/vcpkg"
          git -C "$RUNNER_TEMP/vcpkg" remote add origin https://github.com/microsoft/vcpkg.git
          git -C "$RUNNER_TEMP/vcpkg" fetch --depth 1 origin "$VCPKG_COMMIT"
          git -C "$RUNNER_TEMP/vcpkg" checkout --detach FETCH_HEAD
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"

      - name: Configure
        run: >-
          cmake -S backend -B backend/build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DVCPKG_OVERLAY_PORTS="${{ github.workspace }}/backend/vcpkg-overlay-ports"
          -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build backend/build --parallel 2

      - name: Apply MySQL schema
        env:
          MYSQL_PWD: ${{ env.MYSQL_ROOT_PASSWORD }}
        run: mysql --host="$DB_HOST" --port="$DB_PORT" --user=root < backend/schema.sql

      - name: Configure application database authentication
        env:
          MYSQL_PWD: ${{ env.MYSQL_ROOT_PASSWORD }}
        run: |
          mysql --host="$DB_HOST" --port="$DB_PORT" --user=root \
            --execute="ALTER USER '$DB_USER'@'%' IDENTIFIED WITH mysql_native_password BY '$DB_PASSWORD'"

      - name: Verify application database connection
        env:
          MYSQL_PWD: ${{ env.DB_PASSWORD }}
        run: |
          mysql --connect-timeout=5 --host="$DB_HOST" --port="$DB_PORT" \
            --user="$DB_USER" --database="$DB_NAME" \
            --batch --skip-column-names --execute="SELECT 1" \
            | grep -qx "1"

      - name: Verify one-time administrator bootstrap
        run: |
          printf '%s\n' \
            'Jirani Circle CI' \
            'CI Administrator' \
            '+254712345678' \
            'ci-only-bootstrap-password' > "$RUNNER_TEMP/bootstrap-input.txt"

          timeout --signal=TERM --kill-after=10s 90s \
            gdb --batch --quiet --return-child-result \
              -ex "set pagination off" \
              -ex "run < $RUNNER_TEMP/bootstrap-input.txt" \
              --args ./backend/build/jirani-circle-bootstrap-admin

          if second_bootstrap_output=$(printf '%s\n' \
            'Second Chama' \
            'Second Administrator' \
            '+254712345679' \
            'ci-only-bootstrap-password' \
            | timeout --signal=TERM --kill-after=10s 30s \
                ./backend/build/jirani-circle-bootstrap-admin 2>&1); then
            echo "Bootstrap unexpectedly allowed a second administrator."
            exit 1
          fi
          printf '%s' "$second_bootstrap_output" \
            | grep -q "An administrator already exists; bootstrap is disabled."

          admin_count=$(MYSQL_PWD="$DB_PASSWORD" mysql \
            --host="$DB_HOST" --port="$DB_PORT" --user="$DB_USER" \
            --database="$DB_NAME" --batch --skip-column-names \
            --execute="SELECT COUNT(*) FROM members m JOIN users u ON u.id = m.user_id WHERE m.role = 'admin' AND m.chama_id = (SELECT id FROM chamas WHERE name = 'Jirani Circle CI') AND u.status = 'active' AND u.password_hash LIKE CONCAT(CHAR(36), 'argon2id', CHAR(36), '%')")
          test "$admin_count" = "1"

      - name: Check API and database readiness
        run: |
          ./backend/build/jirani-circle-api > "$RUNNER_TEMP/jirani-circle-api.log" 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/api/v1/health \
              | grep -q '"status":"ok"'; then
              exit 0
            fi
            if ! kill -0 "$api_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/jirani-circle-api.log"
              exit 1
            fi
            sleep 1
          done

          cat "$RUNNER_TEMP/jirani-circle-api.log"
          exit 1

      - name: Verify immediate member activation lifecycle
        run: |
          ./backend/build/jirani-circle-api > "$RUNNER_TEMP/jirani-circle-api-lifecycle.log" 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          if ! python3 backend/tests/member_lifecycle_ci.py; then
            cat "$RUNNER_TEMP/jirani-circle-api-lifecycle.log"
            exit 1
          fi
